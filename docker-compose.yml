services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: krev2-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: krev2
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d krev2" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: krev2-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/krev2?schema=public"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    # AWS EC2 t3.small resource emulation (2 vCPUs, 2 GB RAM)
    cpus: 2.0
    mem_limit: 2g
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "2.0"
          memory: 2048M

volumes:
  postgres_data:
